<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;800&amp;display=swap');
      .brand { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; font-size: 26px; fill: #1A1C2E; letter-spacing: -0.5px; }
      .brand-em { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; font-size: 26px; fill: #252840; letter-spacing: -0.5px; }
    </style>
  </defs>

  <!-- Icon mark -->
  <g transform="translate(16, 16)">
    <!-- Background pill -->
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#252840"/>
    <!-- Stacked layers icon (white) -->
    <g transform="translate(8, 8)" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Top layer -->
      <polyline points="1,8 16,2 31,8 16,14"/>
      <!-- Middle layer -->
      <polyline points="1,16 16,22 31,16"/>
      <!-- Bottom layer -->
      <polyline points="1,24 16,30 31,24"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="76" y="50">
    <tspan class="brand">Bank </tspan><tspan class="brand-em">Investec</tspan>
  </text>

  <!-- Tagline -->
  <text x="77" y="66" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#9898B0" letter-spacing="0.5px">INDEPENDENT REVIEW</text>
</svg>
